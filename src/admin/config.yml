backend:
  name: github
  repo: friends-of-hall-football/friends-of-hall-football
  branch: main

# Turn off Sveltia's built-in stock photo sources (Unsplash, Pexels, etc.)
# so editors only pick from images actually uploaded to this site.
media_libraries:
  stock_assets:
    providers: []

media_folder: "src/images"
public_folder: "/images"

collections:
  # ---------- News posts ----------
  - name: posts
    label: "News Posts"
    label_singular: "News Post"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date | date('MMM D, YYYY')}}"
    fields:
      - { name: title, label: "Headline", widget: string }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: description, label: "Search & sharing text", widget: text, required: false, hint: "One or two sentences shown under this post's link in Google and on Facebook. Leave blank to use the site tagline." }
      - { name: image, label: "Photo", widget: image, required: false, media_folder: "/src/images/posts", public_folder: "/images/posts" }
      - { name: body, label: "Post", widget: markdown }

  # ---------- Everything else ----------
  - name: data
    label: "Site Content"
    files:
      - name: pages
        label: "Page Text"
        file: "src/_data/pages.json"
        fields:
          - name: hero
            label: "Homepage — Top Banner"
            widget: object
            fields:
              - { name: headline, label: "Headline", widget: string }
              - { name: body, label: "Paragraph", widget: text }
              - { name: primaryButton, label: "Blue button text", widget: string }
              - { name: secondaryButton, label: "White button text", widget: string }
              - { name: image, label: "Banner photo", widget: image, media_folder: "/src/images", public_folder: "/images" }
          - name: storeBanner
            label: "Homepage — Store Banner"
            widget: object
            collapsed: true
            required: false
            hint: >-
              The blue strip above the top banner. Untick "Show the banner" to
              hide it. Leave any text field blank to use the built-in wording.
            fields:
              - { name: enabled, label: "Show the banner", widget: boolean, default: true, required: false }
              - { name: tag, label: "Small label", widget: string, required: false, default: "New" }
              - { name: heading, label: "Headline", widget: string, required: false, default: "The Titans Team Store is open" }
              - { name: body, label: "Supporting line (hidden on phones)", widget: string, required: false, default: "Hoodies, hats, tees, stickers and more — shipped to your door." }
              - { name: button, label: "Button text", widget: string, required: false, default: "Shop Now" }
              - { name: url, label: "Store link", widget: string, required: false, default: "https://friends-of-hall-football.printify.me/" }
          - name: sponsorBand
            label: "Homepage — Sponsor Strip"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
          - name: scheduleSection
            label: "Homepage — Schedule"
            widget: object
            fields:
              - { name: nextUpHeading, label: "Next Up heading", widget: string }
              - { name: nextUpNote, label: "Small note beside it", widget: string }
              - { name: fullHeading, label: "Full schedule heading", widget: string }
              - { name: nextUpImage, label: "Next Up photo", widget: image, media_folder: "/src/images", public_folder: "/images" }
          - name: newsSection
            label: "Homepage — News"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
          - name: socialBand
            label: "Homepage — Follow the Titans"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Paragraph", widget: text }
          - name: newsletterBand
            label: "Homepage — Newsletter Promo"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label above heading", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Paragraph", widget: text }
              - { name: button, label: "Button text", widget: string }
              - { name: image, label: "Newsletter cover", widget: image, media_folder: "/src/images", public_folder: "/images" }
          - name: volunteer
            label: "Homepage — Lend a Hand Band"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Paragraph", widget: text }
              - { name: button, label: "Button text", widget: string }
              - { name: image, label: "Newsletter cover", widget: image, media_folder: "/src/images", public_folder: "/images" }
          - name: volunteerPage
            label: "Volunteer Page"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro paragraph", widget: text }
              - name: signupLinks
                label: "Sign-up links"
                label_singular: "Sign-up link"
                widget: list
                required: false
                summary: "{{fields.label}}"
                hint: >-
                  One entry per SignUpGenius sign-up. Use "Add Sign-up link" to
                  add another, drag to reorder, and the trash icon to remove one.
                fields:
                  - { name: label, label: "Link text", widget: string, hint: "What people see, e.g. Sandwich Sign-up" }
                  - { name: url, label: "SignUpGenius URL", widget: string, pattern: ["^https?://", "Must start with https://"] }
              - { name: closing, label: "Closing paragraph", widget: text }
          - name: sponsorsPage
            label: "Sponsors Page"
            widget: object
            collapsed: true
            required: false
            hint: >-
              The call-to-action band under the sponsorship levels. Leave any
              field blank to use the built-in wording.
            fields:
              - { name: ctaHeading, label: "Heading", widget: string, required: false, default: "Ready to Sponsor?" }
              - { name: ctaBody, label: "Paragraph", widget: text, required: false, default: "Pick your level and complete your sponsorship online. It takes about a minute, and you will get an emailed receipt for your records." }
              - { name: ctaButton, label: "Button text", widget: string, required: false, default: "Become a Sponsor" }
          - name: rostersPage
            label: "Rosters Page"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro paragraph", widget: text, required: false }
          - name: seo
            label: "Search & Sharing Text"
            widget: object
            collapsed: true
            hint: >-
              The sentence that appears under each page's link in Google results
              and when a page is shared on Facebook. Aim for 120-160 characters.
            fields:
              - { name: home, label: "Homepage", widget: text }
              - { name: sponsors, label: "Sponsors page", widget: text }
              - { name: donate, label: "Donate page", widget: text }
              - { name: newsletter, label: "Newsletter page", widget: text }
              - { name: volunteer, label: "Volunteer page", widget: text }
              - { name: rosters, label: "Rosters page", widget: text }
              - { name: sponsorDonate, label: "Sponsor checkout page", widget: text }
              - { name: thankYou, label: "Thank You page", widget: text }
              - { name: sponsorThanks, label: "Sponsor inquiry thank-you page", widget: text }
          - name: sponsorDonatePage
            label: "Sponsor Checkout Page"
            widget: object
            collapsed: true
            hint: >-
              The page at /sponsor-donate.html, used to send a business straight
              to checkout. It is not in the menu; share the link directly.
              The levels, amounts, and benefits come from Sponsorship Levels.
            fields:
              - { name: heading, label: "Heading", widget: string, required: false }
              - { name: intro, label: "Intro paragraph", widget: text, required: false }
              - { name: instruction, label: "Tap instruction", widget: string, required: false, hint: "Short line telling people the levels are tappable. Leave blank for the built-in wording." }
              - { name: payNote, label: "Note below the buttons", widget: text, required: false }
          - name: donatePage
            label: "Donate Page"
            widget: object
            fields:
              - { name: cardHeading, label: "Heading", widget: string }
              - { name: amountLabel, label: "Label above the amounts", widget: string }
              - { name: customButton, label: "Custom-amount button text", widget: string }
              - { name: payNote, label: "Note below the buttons", widget: text }

      - name: newsletterIssues
        label: "Past Newsletter Issues"
        file: "src/_data/newsletterIssues.json"
        fields:
          - name: issues
            label: "Issues"
            widget: list
            label_singular: "Issue"
            summary: "{{fields.season}} — {{fields.title}}"
            fields:
              - { name: season, label: "Season (e.g. Fall 2026)", widget: string }
              - { name: title, label: "Issue title", widget: string }
              - { name: image, label: "Cover image", widget: image, media_folder: "/src/images", public_folder: "/images" }
              - { name: url, label: "Link to this issue", widget: string, required: false }

      - name: schedule
        label: "Game Schedule"
        file: "src/_data/schedule.json"
        fields:
          - name: games
            label: "Games"
            widget: list
            label_singular: "Game"
            summary: "{{fields.date}} — {{fields.opponent}}"
            fields:
              - { name: date, label: "Date (e.g. SAT 10/4)", widget: string }
              - { name: time, label: "Kickoff time", widget: string }
              - { name: opponent, label: "Opponent (start with 'vs' or 'at')", widget: string }
              - { name: type, label: "Type", widget: select, options: ["League · Home", "League", "Scrimmage", "Playoff"] }
              - { name: home, label: "Home game?", widget: boolean, default: false }
              - { name: site, label: "Location", widget: string }
              - { name: bus, label: "Bus leaves (optional)", widget: string, required: false }

      - name: sponsors
        label: "Sponsors"
        file: "src/_data/sponsors.json"
        fields:
          - name: list
            label: "Sponsors"
            widget: list
            label_singular: "Sponsor"
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Business name", widget: string }
              - { name: logo, label: "Logo", widget: image, media_folder: "/src/images/sponsors", public_folder: "/images/sponsors" }
              - name: tier
                label: "Level"
                widget: relation
                required: false
                collection: data
                file: sponsorLevels
                search_fields: ["levels.*.name"]
                value_field: "levels.*.name"
                display_fields: ["levels.*.name"]
                hint: >-
                  Sets how often this sponsor appears near the top of the strip.
                  Higher levels get more entries in the draw, but the order is
                  still random on every page load. Leave blank for a single entry.
              - { name: website, label: "Website", widget: string, required: false }
              - { name: description, label: "Short description", widget: text, required: false, hint: "One or two sentences about the business. If filled in, tapping the logo opens a card with this text and a link to their site instead of going straight there. Leave blank to link straight out." }

      - name: sponsorLevels
        label: "Sponsorship Levels"
        file: "src/_data/sponsorLevels.json"
        fields:
          - name: levels
            label: "Levels"
            widget: list
            label_singular: "Level"
            summary: "{{fields.name}} — ${{fields.amount}}"
            fields:
              - { name: name, label: "Level name", widget: string }
              - { name: slug, label: "Style key (titan / blue / black / friend)", widget: string }
              - { name: amount, label: "Amount (numbers only, no $)", widget: string }
              - { name: paymentLink, label: "Stripe checkout link", widget: string, required: false, hint: "Paste the Stripe payment link for this level. It appears as a button on the Complete Your Sponsorship page. Leave blank to hide that level from the page." }
              - name: benefits
                label: "What they get"
                widget: list
                label_singular: "Benefit"
                field: { name: item, label: "Benefit", widget: string }

      - name: donation
        label: "Donation Buttons"
        file: "src/_data/donation.json"
        fields:
          - name: amounts
            label: "Preset amounts"
            widget: list
            label_singular: "Amount"
            summary: "${{fields.value}}"
            fields:
              - { name: value, label: "Dollar amount", widget: string }
              - { name: link, label: "Stripe Payment Link URL", widget: string }
          - { name: customLink, label: "Custom-amount Payment Link URL", widget: string }

      - name: nav
        label: "Navigation Menu"
        file: "src/_data/nav.json"
        fields:
          - name: items
            label: "Menu items"
            label_singular: "Menu item"
            widget: list
            summary: "{{fields.label}}"
            hint: >-
              Controls the top menu on every page, on desktop and mobile.
              Drag to reorder. Untick "Show in menu" to hide an item without
              deleting it. The Donate button is always shown and is not listed here.
            fields:
              - { name: label, label: "Menu text", widget: string }
              - { name: visible, label: "Show in menu", widget: boolean, default: true }
              - { name: url, label: "Link", widget: string, required: false, hint: "A page on this site like sponsors.html, or a full https:// address for an outside link" }
              - { name: external, label: "Opens in a new tab (outside link)", widget: boolean, default: false }
              - { name: key, label: "Highlight key", widget: string, required: false, hint: "Advanced - leave blank. Matches a page so its menu item is highlighted." }
              - { name: siteKey, label: "Use a link from Site Settings", widget: string, required: false, hint: "Advanced - leave blank. Only used by Team Store, which reads storeUrl." }

      - name: site
        label: "Site Settings"
        file: "src/_data/site.json"
        fields:
          - { name: name, label: "Organization name", widget: string }
          - { name: description, label: "Tagline / meta description", widget: text }
          - { name: url, label: "Site URL", widget: string }
          - { name: shareImage, label: "Sharing photo", widget: image, required: false, media_folder: "/src/images", public_folder: "/images", hint: "Shown when a link to the site is posted on Facebook. Landscape, about 1200x630." }
          - { name: contactEmail, label: "Contact email", widget: string }
          - { name: storeUrl, label: "Team store link", widget: string }
          - { name: facebookUrl, label: "Facebook link", widget: string }
          - { name: instagramUrl, label: "Instagram link", widget: string, required: false }
          - { name: twitterUrl, label: "X (Twitter) link", widget: string, required: false }
          - { name: tiktokUrl, label: "TikTok link", widget: string, required: false }
          - { name: ciacUrl, label: "CIAC schedule link", widget: string }
          - { name: newsletterUrl, label: "Current newsletter link", widget: string }

  - name: rosters
    label: "Rosters"
    label_singular: "Season roster"
    folder: "src/_data/rosters"
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: season
    slug: "{{fields.season}}"
    summary: "{{fields.season}} season"
    description: >-
      One file per season. To load a whole roster at once use the CSV importer
      at /admin/roster-import.html, then add the downloaded file to the repo.
      Editing here is best for small fixes, like moving one player up a team.
    fields:
      - { name: season, label: "Season year", widget: string, pattern: ['^\d{4}$', "Use a four-digit year, e.g. 2026"], hint: "Must match the file name" }
      - name: players
        label: "Players"
        label_singular: "Player"
        widget: list
        summary: "{{fields.number}} {{fields.name}} - {{fields.team}}"
        fields:
          - { name: number, label: "Jersey number", widget: string, required: false }
          - { name: name, label: "Player name", widget: string }
          - { name: grade, label: "Grade", widget: string, required: false, hint: "e.g. Sr., Jr., So., Fr." }
          - { name: position, label: "Position", widget: string, required: false }
          - { name: height, label: "Height", widget: string, required: false }
          - { name: weight, label: "Weight", widget: string, required: false }
          - name: team
            label: "Team"
            widget: select
            options: ["Varsity", "Junior Varsity", "Freshman"]
